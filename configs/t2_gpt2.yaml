model_name: openai-community/gpt2
train_path: data/raw/train.csv
dev_path: data/raw/dev.csv
output_dir: checkpoints/t2_gpt2

num_train_epochs: 3
batch_size: 16
eval_batch_size: 16
learning_rate: 0.0002
weight_decay: 0.0
grad_clip: 1.0
max_length: 256
num_workers: 0
use_amp: true

lora:
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - c_attn
